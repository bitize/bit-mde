name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nenhum job aqui escreve no repositório: leitura basta, e o GITHUB_TOKEN
# não fica gravado no .git/config dos runners (persist-credentials: false).
permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x', '24.x']

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # A suíte lê certs/ no topo de cada módulo de teste. Um certificado
      # autoassinado descartável basta para tudo, menos sefaz.test.js.
      - name: Gerar certificado de teste
        run: npm run certs:teste

      # Exclui sefaz.test.js: é teste de integração real contra os endpoints de
      # produção e homologação da SEFAZ, e exige certificado ICP-Brasil válido.
      - name: Rodar testes
        run: npm run test:ci
